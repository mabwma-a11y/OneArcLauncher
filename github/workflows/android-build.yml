name: Build OneArc Launcher APK (da ZIP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trova ed estrai il file ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Errore: nessun file .zip trovato nella radice del repository."
            exit 1
          fi
          echo "Estrazione di: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Errore: file settings.gradle.kts non trovato dentro lo ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Cartella progetto rilevata: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload OneArc Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OneArc-Launcher-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
